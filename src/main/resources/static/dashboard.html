<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>压测监控面板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 30px; }
  h1 { text-align: center; margin-bottom: 8px; font-size: 24px; }
  .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 30px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto 30px; }
  .card { background: #16213e; border-radius: 12px; padding: 24px; text-align: center; border: 1px solid #0f3460; }
  .card .label { font-size: 13px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .card .value { font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .value.green { color: #2ecc71; }
  .card .value.red { color: #e74c3c; }
  .card .value.blue { color: #3498db; }
  .card .value.yellow { color: #f1c40f; }

  .chart-container { max-width: 900px; margin: 0 auto 30px; background: #16213e; border-radius: 12px; padding: 24px; border: 1px solid #0f3460; }
  .chart-container h3 { margin-bottom: 16px; font-size: 14px; color: #888; }
  .bar-wrap { margin-bottom: 12px; }
  .bar-wrap .bar-label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
  .bar-wrap .bar-label span:last-child { color: #888; }
  .bar-track { height: 28px; background: #0f3460; border-radius: 6px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
  .bar-fill.sold { background: linear-gradient(90deg, #e74c3c, #c0392b); }
  .bar-fill.remain { background: linear-gradient(90deg, #2ecc71, #27ae60); }

  .log-box { max-width: 900px; margin: 0 auto; background: #0d1117; border-radius: 12px; padding: 20px; border: 1px solid #30363d; font-family: 'SF Mono', monospace; font-size: 13px; height: 300px; overflow-y: auto; white-space: pre-wrap; color: #8b949e; }

  .controls { max-width: 900px; margin: 0 auto 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 13px; color: #888; }
  .controls input { width: 80px; padding: 8px 12px; border: 1px solid #0f3460; border-radius: 6px; background: #16213e; color: #eee; font-size: 14px; text-align: center; }
  .btn { padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .btn-refresh { background: #3498db; color: #fff; }
  .btn-reset { background: #2c3e50; color: #ccc; }
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .status-badge.live { background: #2ecc7122; color: #2ecc71; animation: pulse 1s infinite; }
  .status-badge.soldout { background: #e74c3c22; color: #e74c3c; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
</style>
</head>
<body>
<h1>秒杀压测监控面板</h1>
<div class="subtitle">实时监控 Redis 库存 — 请用 JMeter 执行压测</div>

<div class="controls">
  <label>商品ID</label>
  <input type="number" id="goodsId" value="1" min="1" max="8">
  <button class="btn btn-refresh" onclick="switchGoods()">切换商品</button>
  <button class="btn btn-reset" onclick="resetView()">重置计数</button>
  <span class="status-badge live" id="statusBadge">监控中</span>
</div>

<div class="grid">
  <div class="card">
    <div class="label">剩余库存</div>
    <div class="value green" id="stockVal">--</div>
  </div>
  <div class="card">
    <div class="label">本轮已售</div>
    <div class="value red" id="soldVal">--</div>
  </div>
  <div class="card">
    <div class="label">预估 QPS</div>
    <div class="value blue" id="qpsVal">0</div>
  </div>
  <div class="card">
    <div class="label">累计售出</div>
    <div class="value yellow" id="totalSoldVal">0</div>
  </div>
</div>

<div class="chart-container">
  <h3>库存消耗进度</h3>
  <div class="bar-wrap">
    <div class="bar-label"><span>本轮已售</span><span id="soldPct">0%</span></div>
    <div class="bar-track"><div class="bar-fill sold" id="soldBar" style="width:0%"></div></div>
  </div>
  <div class="bar-wrap">
    <div class="bar-label"><span>剩余库存</span><span id="remainPct">100%</span></div>
    <div class="bar-track"><div class="bar-fill remain" id="remainBar" style="width:100%"></div></div>
  </div>
</div>

<div class="log-box" id="logBox">
  等待库存数据...
</div>

<script>
var BASE = ''; // 同源
var goodsId = 1;
var monitorToken = '';
var initialStock = 0;   // 本轮基准库存
var lastStock = 0;      // 上次采样的库存
var lastPollTime = 0;
var totalSold = 0;      // 跨轮累计售出
var logLines = [];
var pollTimer = null;
var soldOut = false;

// ---- Init ----
initMonitor();

async function initMonitor() {
  monitorToken = await getToken('monitor');
  startPolling();
}

async function getToken(userId) {
  try {
    var r = await fetch('/auth/test-token?userId=' + encodeURIComponent(userId), { method: 'POST' });
    var d = await r.json();
    if (d.code === 1 && d.data && d.data.token) {
      return d.data.token;
    }
  } catch(e) {}
  return null;
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, 250);
  poll();
}

function poll() {
  if (!monitorToken) return;
  fetch('/seckill/stock/' + goodsId, {
    headers: { 'Authorization': 'Bearer ' + monitorToken }
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.code !== 1) return;
      var stock = d.data;
      var now = Date.now();

      // 初始化基线
      if (initialStock === 0) {
        initialStock = stock;
        lastStock = stock;
        lastPollTime = now;
        totalSold = 0;
        addLog('[就绪] 商品#' + goodsId + ' 初始库存 ' + stock);
      }

      // 检测补货：库存回升 → 自动重置本轮基线，保留累计
      if (stock > lastStock) {
        var roundSold = initialStock - lastStock;
        totalSold += roundSold;
        addLog('[补货] 库存恢复 ' + lastStock + ' → ' + stock + ' (上轮售出 ' + roundSold + ')');
        initialStock = stock;
      }

      // 本轮已售
      var sold = Math.max(0, initialStock - stock);
      var soldPct = initialStock > 0 ? Math.min(100, (sold / initialStock * 100)).toFixed(0) : 0;
      var remainPct = initialStock > 0 ? Math.max(0, (stock / initialStock * 100)).toFixed(0) : 100;

      document.getElementById('stockVal').textContent = stock;
      document.getElementById('soldVal').textContent = sold;
      document.getElementById('totalSoldVal').textContent = totalSold + sold;
      document.getElementById('soldPct').textContent = soldPct + '%';
      document.getElementById('remainPct').textContent = remainPct + '%';
      document.getElementById('soldBar').style.width = soldPct + '%';
      document.getElementById('remainBar').style.width = remainPct + '%';

      // 预估 QPS：库存减少时实时计算，库存稳定时逐步归零
      if (lastStock > stock) {
        var elapsed = (now - lastPollTime) / 1000;
        if (elapsed > 0) {
          document.getElementById('qpsVal').textContent = Math.round((lastStock - stock) / elapsed);
        }
        lastPollTime = now;
      } else if (lastStock === stock && lastPollTime > 0) {
        // 库存未变，QPS 衰减显示
        var idle = (now - lastPollTime) / 1000;
        if (idle > 0.5) document.getElementById('qpsVal').textContent = '0';
      }
      lastStock = stock;

      // 售罄
      if (stock <= 0 && !soldOut) {
        soldOut = true;
        document.getElementById('statusBadge').textContent = '已售罄';
        document.getElementById('statusBadge').className = 'status-badge soldout';
        addLog('[售罄] 商品#' + goodsId + ' 库存耗尽！累计售出 ' + (totalSold + sold));
      }
    }).catch(function(e) {});
}

function switchGoods() {
  goodsId = parseInt(document.getElementById('goodsId').value) || 1;
  resetCounters();
  addLog('[切换] 监控商品#' + goodsId);
  startPolling();
}

function resetView() {
  resetCounters();
  logLines = [];
  document.getElementById('logBox').textContent = '等待库存数据...';
  startPolling();
}

function resetCounters() {
  initialStock = 0;
  lastStock = 0;
  totalSold = 0;
  soldOut = false;
  lastPollTime = 0;
  document.getElementById('statusBadge').textContent = '监控中';
  document.getElementById('statusBadge').className = 'status-badge live';
  document.getElementById('stockVal').textContent = '--';
  document.getElementById('soldVal').textContent = '--';
  document.getElementById('qpsVal').textContent = '0';
  document.getElementById('totalSoldVal').textContent = '0';
  document.getElementById('soldPct').textContent = '0%';
  document.getElementById('remainPct').textContent = '100%';
  document.getElementById('soldBar').style.width = '0%';
  document.getElementById('remainBar').style.width = '100%';
}

function addLog(msg) {
  var time = new Date().toLocaleTimeString();
  logLines.push('[' + time + '] ' + msg);
  if (logLines.length > 100) logLines.shift();
  document.getElementById('logBox').textContent = logLines.join('\n');
  document.getElementById('logBox').scrollTop = document.getElementById('logBox').scrollHeight;
}
</script>
</body>
</html>
